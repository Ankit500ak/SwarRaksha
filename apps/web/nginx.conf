server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side views (e.g. /privacy, /terms deep links)
    # must serve the app shell instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
