name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (API + services + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Base dependency set (same list as the Makefile `setup` target).
        # cryptography is intentionally not installed: it is not listed
        # in apps/api/requirements.txt on this branch. Add it here if a
        # future requirements change adds it.
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy scipy soundfile fastapi "uvicorn[standard]" sqlalchemy pyjwt python-multipart pydantic pytest httpx cryptography

      - name: Run tests
        env:
          PYTHONPATH: services/ml-inference:services/voiceprint:apps/api
        run: .venv/bin/python -m pytest tests/ -q

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
